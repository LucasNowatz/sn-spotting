[task]
name = "afterquery/growth-event-attribution"
description = "Invert a synthetic regional nanoparticle transport-and-growth system under correlated station errors and a non-diagonal prior, decompose a growth-event enhancement into nucleation and condensation by full counterfactual re-integration with calibrated uncertainty, price the poorly known regional source strengths, attribute the grown particles to their source regions, and predict withheld stations and days with calibrated spreads."
authors = [{ name = "George Strong", email = "georgesmartlee23@gmail.com" }]
keywords = [
    "new particle formation",
    "nanoparticle growth",
    "regional transport",
    "counterfactual attribution",
    "bayesian inversion",
    "correlated observation errors",
    "source apportionment",
    "uncertainty quantification",
]

[metadata]
author_name = "George Strong"
author_email = "georgesmartlee23@gmail.com"
author_organization = "all.health"
author_profile = "https://www.linkedin.com/in/georgewstrong/"
research_advisor = ""
