]
expert_time_estimate_hours = 20
relevant_experience = "My background is in computational physics, machine learning, neuroimaging, and inverse problems. I hold a PhD in Machine Learning for Ultrasound Neuroimaging from Imperial College London and have experience developing and applying tomography, adjoint-state methods, full-waveform inversion, numerical simulations, and distributed GPU-based optimisation for imaging problems. My research and publications include probabilistic approaches to tomography and adjoint-state methods, full-waveform inversion, and high-performance computational imaging. I have also worked extensively with Python, CUDA, parallel computing, GPU clusters, and numerical modelling. The building blocks of this task, a conservative finite-volume forward model coupled to size-resolved microphysics, a whitened Gaussian objective under a full error covariance, Gauss-Newton posteriors and their propagation through a nonlinear counterfactual map, are the ones I use daily in probabilistic tomography."
difficulty_explanation = """
Synthetic data, stated as such in the manifest: a seeded conservative
finite-volume simulator on the published 4 km grid with a 30 s step and
region-tagged number on an analytic non-divergent wind, with the truth drawn once from the published
prior and the errors drawn once from the published covariance. The answer
exists nowhere online.

What makes this hard is that a demanding forward model and a demanding
inference have to be right at the same time, and each hides the other's
mistakes. The forward model is a regional transport operator whose numerical
diffusion must be measured and held far below the eddy diffusivity being
inferred, built on the published streamfunction so its divergence vanishes,
coupled to a conservative flux through diameter space whose converged step is
dictated by the narrow small bins rather than the Courant number, and carrying
tagged number per source region for the shares. The inference is a
twelve-parameter problem with a non-diagonal prior, station errors that are
AR(1) in time and carry a per-deployment bias shared across every channel and
time of an instrument, station-specific sizing operators, censored channels,
and curved valleys between vapour lifetime, yield, growth coefficient, loss
timescale and the regional strengths, and between the base strengths and the
nucleation anomaly.

The graded quantities are derived. The event enhancement is not additive in
its two causes because survival into the grown bins depends on growth rate;
the interaction is a sizeable fraction of the enhancement, so the split must
come from four full counterfactual re-integrations, which the verifier
recomputes from the submitted estimate. Its spread must be propagated through
that nonlinear map, the analysis must be repeated with the regional strengths
clamped to price them, region shares must come from tagged transport, and the
predictive spreads at withheld rows are scored against withheld noisy records
by coverage and a log score that reject both hedging and overconfidence. A
diagonal-covariance fit yields a chi-square that the recomputation from the
submitted fitted values exposes; borrowing one station's operator for another,
the Eulerian fallacy, and an under-resolved step each fail a separate gate.

An expert needs several days: build and check the forward model against the
published self-tests and step refinement, assemble the whitened objective,
run and debug a multi-start Gauss-Newton inversion, propagate the posterior,
run the restricted analysis and the tagged pass, and audit every number.
"""
solution_explanation = """
Build the forward model on the published grid with face winds from the
corner streamfunction and an unsplit limited flux-form step, and verify it
with the uniform-field and Gaussian-blob checks and by halving the step. The
vapour equation is independent of the particle parameters, so a cheap
vapour-only fit of diffusivity, entrainment, lifetime, yield and the vapour
anomaly gives a good start.

Pose the objective in the prior's log coordinates, whiten each deployment
block with the Cholesky factor of its published covariance restricted to
usable channels and the prior term with the Cholesky factor of the prior,
and run Levenberg-Marquardt with forward-difference Jacobians from that start
and two random prior draws; it converges in a handful of iterations. The
Gauss-Newton Hessian gives the posterior covariance, the degrees of freedom
for signal and the width ratios.

Run the four counterfactuals as complete re-integrations of the event days
with the anomaly log-parameters zeroed in every combination, and carry the
posterior onto A_E and A_C by the delta method with a finite-difference
gradient of the counterfactual map. Repeat the inversion with the regional
strengths clamped at their prior means and compare spreads. Predictive
spreads at withheld rows are the Jacobian-propagated latent variance plus the
published marginal error and a representation floor. A tagged pass at the
estimate yields the region shares. The reference takes about half an hour on
four cores.
"""
verification_explanation = """
Ground truth is a seeded simulator separate from the reference: its own
implementation of the same equations with a shorter step on the published
grid, carrying region-tagged number; its own counterfactual runs define the
attribution truth and its tagged fields define the shares. Every limit also
allows for a correct scheme with a different flux limiter, whose distance
from the truth is measured with the generator's solver. The reference never produces a graded value.

Twelve gates. Withheld vapour, size distributions and a number-weighted
diameter, and the region shares, are compared with that truth under limits
set mechanically from the measured floor (the reference solver at the true
parameters against the generator's discretisation), the oracle's own score and the nearest
shortcut, by a script that refuses to write a limit that cannot separate
them; both withheld days must pass alone. Predictive spreads are scored
against the withheld noisy records by coverage and a Gaussian log score;
the posterior by width ratios and degrees of freedom. Nothing asserted is
trusted: a sealed re-run of the submitted estimate must reproduce the
submitted predictions, fitted values and counterfactual statistics, the
reported chi-square must equal the one recomputed from the submitted fitted
values with the full covariance, the decomposition must match the
generator's counterfactuals within tolerance with its spread inside a band,
and the restricted analysis must show the measured variance share and
correlation. Twelve recorded baselines all score 0: climatology, nearest
station, collapsed and inflated spreads, copied attribution, linearised
attribution, false sensitivity, shuffled rows, a borrowed operator, frozen
anomalies, a diagonal-covariance chi-square and constant shares. The reward
is 1 only when every gate passes, 0 otherwise, including on a crash.
"""

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

