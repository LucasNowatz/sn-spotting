[task]
name = "afterquery/growth-event-attribution"
description = "Invert a synthetic regional transport and nanoparticle-growth system with correlated observation errors and a non-diagonal prior, then decompose a growth-event enhancement into nucleation and condensation contributions with calibrated uncertainty, quantify how much of that uncertainty the unknown source strengths carry, and predict withheld stations and episodes with calibrated predictive distributions."
authors = [{ name = "George Strong", email = "georgesmartlee23@gmail.com" }]
keywords = [
    "atmospheric transport",
    "aerosol microphysics",
    "new particle formation",
    "bayesian inverse modeling",
    "counterfactual attribution",
    "uncertainty quantification",
    "correlated observation errors",
    "air-mass history",
]

[metadata]
author_name = "George Strong"
author_email = "georgesmartlee23@gmail.com"
author_organization = "all.health"
author_profile = "https://www.linkedin.com/in/georgewstrong/"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "earth-sciences"
field = "atmospheric-sciences"
