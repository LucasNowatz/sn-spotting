expert_time_estimate_hours = 20
relevant_experience = "My background is in computational physics, machine learning, neuroimaging, and inverse problems. I hold a PhD in Machine Learning for Ultrasound Neuroimaging from Imperial College London and have experience developing and applying tomography, adjoint-state methods, full-waveform inversion, numerical simulations, and distributed GPU-based optimisation for imaging problems. My research and publications include probabilistic approaches to tomography and adjoint-state methods, full-waveform inversion, and high-performance computational imaging. I have also worked extensively with Python, CUDA, parallel computing, GPU clusters, and numerical modelling. This task combines a conservative finite-volume transport solver coupled to size-resolved aerosol microphysics with a Bayesian inversion under correlated errors and a counterfactual decomposition, which are the same building blocks I use in probabilistic tomography: a PDE forward model, a whitened Gaussian objective, Gauss-Newton posteriors and their propagation onto derived quantities."
difficulty_explanation = """
The data are synthetic and the manifest says so: a seeded conservative
finite-volume simulator at 2.5 km with a 30 s step and source-tagged tracers
on an analytic non-divergent wind field, with the true parameter vector drawn
once from the published prior and the observation errors drawn once from the
published covariance. Nothing about the answer exists online.

The difficulty is that two hard problems have to be solved at the same time
and each one poisons the other if done carelessly. The first is the forward
model: a regional transport operator whose numerical diffusion must be
measured and kept well below the diffusivity being inferred, built on the
published streamfunction so that its discrete divergence vanishes, coupled
to a conservative flux through diameter space whose time step is set by the
narrow small-diameter bins rather than by the Courant number, with
source-tagged number and an age moment carried alongside for the lineage
diagnostics. The second is the inference: twelve log-parameters with a
non-diagonal prior, observation errors that are correlated in time and carry
a per-deployment bias shared across all channels of an instrument, station-
specific sizing operators, censored channels below the detection limit, and
curved valleys between the vapour lifetime, the yield scale, the growth
coefficient, the particle-loss timescale and the regional source strengths.

The graded questions are then derived quantities. The event enhancement is
not additive in nucleation and condensation, because survival to the grown
size range depends on growth rate, so the decomposition has to come from
four full counterfactual re-integrations and not from a linearisation; the
verifier recomputes all four from the submitted estimate. Its uncertainty
has to be propagated through that nonlinear map, the same analysis has to be
repeated with the source strengths clamped to expose how much of the
uncertainty they carry, and the predictive distributions at the withheld
rows are scored against the withheld noisy observations with a log score
that rejects hedging as well as overconfidence. Fitting with a diagonal
error covariance gives a confident wrong posterior and a chi-square that the
verifier's recomputation with the full covariance exposes. Using one
station's sizing operator for another, the Eulerian fallacy of reading a
station time series as one growing population, and an under-resolved time
step each fail a different gate.

A domain expert needs several days: build and check the forward model
against the two published numerical self-tests, assemble the whitened
objective from the published blocks, run and debug a multi-start
Gauss-Newton inversion, propagate the posterior onto the counterfactuals and
the predictions, run the restricted analysis, and check every number before
believing it.
"""
solution_explanation = """
Read the specification and build the forward model on the public grid with
face winds from the corner streamfunction and a limited unsplit flux-form
scheme, then verify it against the uniform-tracer and Gaussian-plume checks
and against step refinement before fitting anything. The vapour equation
does not depend on the particle parameters, so a cheap vapour-only fit of
the diffusivity, entrainment, lifetime, yield and vapour anomaly gives a
good start for the joint problem.

Write the objective in the prior's log coordinates, whiten every deployment
block with the Cholesky factor of its published covariance restricted to the
usable channels, and whiten the prior term with the Cholesky factor of the
non-diagonal prior. Levenberg-Marquardt with forward-difference Jacobians
over all twelve parameters converges in a handful of iterations from
several starts. The Gauss-Newton Hessian at the optimum gives the posterior
covariance, the degrees of freedom for signal and the posterior/prior width
ratios.

Run the four counterfactuals as full re-integrations over the event days
with the anomaly log-parameters zeroed in every combination, and propagate
the posterior onto A_E and A_C by the delta method with a finite-difference
gradient of the counterfactual map. Repeat the inversion with the three
source strengths clamped at their prior means and compare the two posterior
standard deviations. Predictive spreads at the withheld rows are the latent
Jacobian-propagated variance plus the published marginal error variance and
a representation floor. A final tagged pass at the estimate yields the
lineage diagnostics. The reference does all of this in about an hour on
four cores.
"""
verification_explanation = """
Ground truth comes from a seeded simulator independent of the reference
solution, run at twice the public resolution with a shorter step, carrying
source-tagged number and an age moment; its own counterfactual runs define
the attribution truth. The reference never produces a graded value.

The verifier compares withheld vapour and size-distribution predictions, a
number-weighted diameter derived from them, and both lineage diagnostics
against that truth, under tolerances calibrated from the measured achievable
floor, which is the discrepancy between a correct 5 km solver at the true
parameters and the 2.5 km truth, and from the oracle's own score, with each
limit required to stay well below the nearest shortcut baseline. Both
withheld episodes must pass on their own. Predictive spreads are scored
against the withheld noisy observations by 90 per cent coverage and a
Gaussian log score, and the posterior by width ratios and degrees of freedom;
parameter point values are graded only through the published bounds.

Nothing the submission asserts is trusted. The submitted estimate is re-run
through a trusted forward model on the public grid, which must reproduce
the submitted predictions, the reported chi-square under the full published
covariance, and the four submitted counterfactual statistics; the
attribution and its uncertainty are then checked against the generator's
truth and a band. The restricted analysis is checked for the variance share
the source strengths carry and for the posterior correlation between the two
anomalies. Recorded baselines, climatology, nearest-station copying, the
prior alone, collapsed and inflated uncertainties, an attribution copied at
its true values, a linearised attribution, a wrong sizing operator, shuffled
predictions, a false sensitivity claim and an analysis that never moves the
anomalies, all score 0. The reward is 1 only if every gate passes, and 0
otherwise, including on a crash.
"""

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "public"
